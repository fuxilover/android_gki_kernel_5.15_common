name: Build hfdem Kernel with SUSFS

on:
  workflow_dispatch: # Запуск по кнопке из вкладки Actions

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04
    
    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: ⚙️ Setup Build Environment
      run: |
        echo "Установка зависимостей..."
        sudo apt-get update
        sudo apt-get install -y build-essential bc zip gcc clang lld binutils-aarch64-linux-gnu curl git wget python3
        
    - name: 🛠️ Download Toolchain (Proton Clang)
      run: |
        echo "Скачивание компилятора..."
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: 💉 Inject SUSFS Patch (On-the-fly)
      run: |
        echo "Интеграция SUSFS в исходный код ядра..."
        # Скачиваем официальные патчи simonpunk
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git
        
        # Применяем патч для ветки GKI 5.15
        patch -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-gki-android12-5.15.patch
        
        # Переносим заголовочный файл и файл с логикой
        cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
        cp susfs4ksu/kernel_patches/fs/susfs.c fs/
        
        echo "Патч SUSFS успешно применён!"

    - name: 🔨 Compile Kernel
      run: |
        echo "Запуск компиляции..."
        
        # Настройка путей и переменных окружения
        export PATH="$(pwd)/toolchain/bin:$PATH"
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        export LLVM=1
        export LLVM_IAS=1

        # Очистка рабочей директории
        make O=out clean
        make O=out mrproper

        # Генерация конфига
        # ВАЖНО: Если hfdem использует кастомный конфиг (например, kalama_defconfig для Xiaomi 13), 
        # замени gki_defconfig ниже на нужное название.
        make O=out gki_defconfig

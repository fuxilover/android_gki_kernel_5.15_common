name: Build GKI Kernel with KSU Next, SUSFS, and KProfiles

on:
  workflow_dispatch: # Кнопка ручного запуска в панели управления Actions

jobs:
  build:
    name: Build Kernel (arm64)
    runs-on: ubuntu-latest

    steps:
    - name: Maximize Build Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev xz-utils curl git python3 ccache

    - name: Clone GKI Source and Utilities
      run: |
        mkdir -p kernel-workspace
        cd kernel-workspace
        
        # Клонируем ваше дерево ядра сразу в папку common
        git clone https://github.com/fuxilover/android_gki_kernel_5.15_common.git common --depth=1
        
        # Скачиваем официальные скрипты сборки ядра от Google
        git clone https://android.googlesource.com/kernel/build --depth=1
        
        # Скачиваем GCC кросс-компиляторы для архитектуры arm/arm64
        git clone https://github.com/mvaisakh/gcc-arm64.git prebuilts/gcc/linux-x86/aarch64/aarch64-elf --depth=1
        git clone https://github.com/mvaisakh/gcc-arm.git prebuilts/gcc/linux-x86/arm/arm-eabi --depth=1
        
        # Скачиваем стабильный тулчейн Proton Clang для компиляции
        git clone https://github.com/kdrag0n/proton-clang.git clang-bin --depth=1

    - name: Patch KernelSU Next, SUSFS, and KProfiles
      run: |
        cd kernel-workspace
        
        # 1. Интеграция KernelSU Next напрямую из официального репозитория через Git
        echo "[+] Интеграция KernelSU Next..."
        rm -rf common/drivers/kernelsu
        git clone https://github.com/rifsxd/KernelSU-Next.git common/drivers/kernelsu -b next --depth=1
        
        # Встраиваем KernelSU в конфигурацию сборки драйверов ядра
        grep -q "kernelsu" common/drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
        grep -q "kernelsu" common/drivers/Makefile || echo "obj-y += drivers/kernelsu/" >> common/drivers/Makefile

        # 2. Загрузка и подготовка патчей SUSFS
        echo "[+] Загрузка патчей SUSFS..."
        rm -rf susfs4ksu
        git clone https://github.com/sidex15/susfs4ksu.git
        
        # Копируем файлы ядра SUSFS в дерево исходников
        cp susfs4ksu/kernel_patches/fs/susfs.c common/fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h common/include/linux/

        # Применяем патч к ядру 5.15
        cd common
        SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches/ -name "*5.15*.patch" | head -n 1)
        echo "[+] Применяем патч к ядру: $SUSFS_PATCH"
        patch -p1 < "$SUSFS_PATCH"

        # Применяем патч совместимости к KernelSU Next
        cd drivers/kernelsu
        KSUN_SUSFS_PATCH=$(find ../../../susfs4ksu/ksu_patches/ -name "*next*.patch" -o -name "*ksu*.patch" | head -n 1)
        echo "[+] Применяем патч к KernelSU Next: $KSUN_SUSFS_PATCH"
        patch -p1 < "$KSUN_SUSFS_PATCH"
        cd ../..

        # 3. Принудительная активация модулей в файле конфигурации ядра (gki_defconfig)
        echo "[+] Активация модулей в gki_defconfig..."
        DEFCONFIG="arch/arm64/configs/gki_defconfig"
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_KSU_NEXT=y" >> $DEFCONFIG
        echo "CONFIG_SUSFS=y" >> $DEFCONFIG
        echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
        echo "CONFIG_KPROFILES=y" >> $DEFCONFIG

    - name: Execute GKI Build Process
      run: |
        cd kernel-workspace
        
        # Экспортируем пути к нашему кастомному компилятору Clang и утилитам GCC
        export PATH="$(pwd)/clang-bin/bin:$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-elf/bin:$(pwd)/prebuilts/gcc/linux-x86/arm/arm-eabi/bin:$PATH"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-elf-
        export CROSS_COMPILE_ARM32=arm-eabi-
        
        # Запуск официального скрипта сборки Google GKI
        BUILD_CONFIG=common/build.config.gki.arm64 build/build.sh

    - name: Upload Compiled Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GKI-Kernel-Xiaomi13
        path: |
          kernel-workspace/out/android14-5.15/dist/Image
          kernel-workspace/out/android14-5.15/dist/Image.lz4
          kernel-workspace/out/android14-5.15/dist/Image.gz

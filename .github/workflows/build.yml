name: Build GKI Kernel with KSU Next, SUSFS, and KProfiles

on:
  workflow_dispatch: # Запуск вручную через вкладку Actions

jobs:
  build:
    name: Build Kernel (arm64)
    runs-on: ubuntu-latest

    steps:
    - name: Maximize Build Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        df -h

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev xz-utils curl git repo python3

    - name: Initialize Repo and Sync GKI Source
      run: |
        mkdir kernel-workspace && cd kernel-workspace
        repo init -u https://android.googlesource.com/kernel/manifest -b android14-5.15 --depth=1
        repo sync -c -j$(nproc) --no-tags --no-clone-bundle
        
        # Заменяем дефолтный common на ваш репозиторий с фиксами под Xiaomi 13
        rm -rf common
        git clone https://github.com/fuxilover/android_gki_kernel_5.15_common.git common --depth=1

    - name: Patch KernelSU Next, SUSFS, and KProfiles
      run: |
        cd kernel-workspace
        
        # 1. Интеграция KernelSU Next (через main ветку во избежание pathspec ошибок)
        echo "[+] Интеграция KernelSU Next..."
        cd common
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/main/kernel/setup.sh" | bash -s main
        cd ..

        # 2. Клонирование SUSFS со стабильного публичного зеркала GitHub
        echo "[+] Загрузка патчей SUSFS..."
        rm -rf susfs4ksu
        git clone https://github.com/sidex15/susfs4ksu.git
        
        # Копирование файлов SUSFS в структуру ядра
        cp susfs4ksu/kernel_patches/fs/susfs.c common/fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h common/include/linux/

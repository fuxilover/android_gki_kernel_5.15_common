- name: Clone Toolchains, Setup KernelSU-Next and Patch SUSFS
      run: |
        # Включаем строгий режим: падать при любой ошибке, логировать команды
        set -euo pipefail
        set -x

        mkdir -p kernel-workspace
        cd kernel-workspace

        # ── 1. КЛОНИРОВАНИЕ РЕПОЗИТОРИЕВ (ОПТИМИЗИРОВАННОЕ) ───────────────────
        echo "=== Cloning sources and toolchains ==="
        
        # Основное ядро (Common GKI)
        git clone https://github.com/fuxilover/android_gki_kernel_5.15_common.git common \
          --depth=1 --single-branch

        # Скрипты сборки Google
        git clone https://android.googlesource.com/kernel/build \
          --branch master-kernel-build-2022 --depth=1 --single-branch

        # Кросс-компиляторы GCC (добавляем --no-tags для экономии памяти)
        git clone https://github.com/mvaisakh/gcc-arm64.git prebuilts/gcc/linux-x86/aarch64/aarch64-elf \
          --depth=1 --single-branch --no-tags
        
        git clone https://github.com/mvaisakh/gcc-arm.git prebuilts/gcc/linux-x86/arm/arm-eabi \
          --depth=1 --single-branch --no-tags

        # Proton Clang
        git clone https://github.com/kdrag0n/proton-clang.git clang-bin \
          --depth=1 --single-branch --no-tags

        # Проверяем наличие build.sh перед тем как продолжить
        if [ ! -f build/build.sh ]; then
          echo "ERROR: build/build.sh not found after clone."
          exit 1
        fi
        echo "[OK] build/build.sh found."

        # ── 2. НАСТРОЙКА KERNELSU-NEXT ───────────────────────────────────────
        echo "=== Setting up KernelSU-Next ==="
        cd common
        
        # Скачиваем официальный скрипт установки и запускаем для ветки 'next'
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        
        cd ..

        # Проверяем, создалась ли симлинк на kernelsu
        if [ ! -L common/drivers/kernelsu ]; then
          echo "ERROR: drivers/kernelsu symlink not created by setup.sh"
          exit 1
        fi
        echo "[OK] drivers/kernelsu symlink present -> $(readlink common/drivers/kernelsu)"

        # ── 3. КЛОНИРОВАНИЕ И НАЛОЖЕНИЕ ПАТЧЕЙ SUSFS ─────────────────────────
        echo "=== Cloning and applying SUSFS ==="
        rm -rf susfs4ksu
        
        git clone https://gitlab.com/simonpunk/susfs4ksu.git \
          -b gki-android13-5.15 --depth=1 --single-branch

        # Копируем новые исходные файлы SUSFS прямо в дерево ядра
        cp susfs4ksu/kernel_patches/fs/*.c common/fs/
        cp susfs4ksu/kernel_patches/include/linux/*.h common/include/linux/

        # Переходим в репозиторий ядра для применения патчей
        cd common

        # Ищем патч ядра SUSFS для KernelSU-Next (обычно идет в комплекте)
        # В зависимости от репозитория simonpunk, имя файла может слегка отличаться. 
        # Скрипт проверит стандартный патч для KsNext:
        
        SUSFS_PATCH="../susfs4ksu/kernel_patches/5.15/0001-KsNext-add-susfs-v1.5.x-to-gki-android13-5.15.patch"

        # Если патч именно для KsNext не найден, ищем общий GKI патч для 5.15
        if [ ! -f "$SUSFS_PATCH" ]; then
          echo "KsNext-specific SUSFS patch not found. Looking for generic 5.15 GKI patch..."
          SUSFS_PATCH="../susfs4ksu/kernel_patches/5.15/0001-add-susfs-v1.5.x-to-gki-android13-5.15.patch"
        fi

        if [ -f "$SUSFS_PATCH" ]; then
          echo "Applying SUSFS patch: $SUSFS_PATCH"
          # Флаг --batch предотвращает зависание воркера, если патч потребует ручного ввода
          # Флаг --forward игнорирует уже примененные патчи
          patch -p1 --batch --forward < "$SUSFS_PATCH"
          echo "[OK] SUSFS patch applied successfully."
        else
          echo "ERROR: No matching SUSFS patch file found in susfs4ksu/kernel_patches/5.15/"
          ls -la "../susfs4ksu/kernel_patches/5.15/"
          exit 1
        fi

        # Возвращаемся в корень воркспейса
        cd ..
        echo "=== Workspace preparation completed successfully ==="

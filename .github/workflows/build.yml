- name: Patch KernelSU Next, SUSFS, and KProfiles
      run: |
        cd kernel-workspace
        
        # 1. Скачиваем репозиторий WildKernels
        git clone https://github.com/WildKernels/GKI_KernelSU_SUSFS.git wild_repo --depth=1
        
        # Интегрируем KernelSU Next
        rm -rf common/drivers/kernelsu
        mkdir -p common/drivers/kernelsu
        if [ -d "wild_repo/KernelSU-Next" ]; then
            cp -r wild_repo/KernelSU-Next/* common/drivers/kernelsu/
        else
            git clone https://github.com/rifsxd/KernelSU-Next.git common/drivers/kernelsu --depth=1
        fi
        
        grep -q "kernelsu" common/drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig
        grep -q "kernelsu" common/drivers/Makefile || echo "obj-y += drivers/kernelsu/" >> common/drivers/Makefile

        # 2. Интеграция SUSFS
        mkdir -p susfs_source && cd susfs_source
        git clone https://github.com/sidex15/susfs4ksu.git --depth=1
        cd ..
        
        cp susfs_source/susfs4ksu/kernel_patches/fs/susfs.c common/fs/
        cp susfs_source/susfs4ksu/kernel_patches/include/linux/susfs.h common/include/linux/

        # Накатываем патчи
        cd common
        WILD_PATCH_515=$(find ../wild_repo/ -name "*5.15*.patch" | head -n 1)
        if [ -f "$WILD_PATCH_515" ]; then
            patch -p1 < "$WILD_PATCH_515" || true
        fi

        cd drivers/kernelsu
        KSU_PATCH=$(find ../../../wild_repo/ -name "*ksu*.patch" -o -name "*next*.patch" | head -n 1)
        if [ -f "$KSU_PATCH" ]; then
            patch -p1 < "$KSU_PATCH" || true
        fi
        cd ../..

    - name: Execute GKI Build Process
      run: |
        cd kernel-workspace
        
        # Модифицируем defconfig прямо СЕЙЧАС (перед самой сборкой, чтобы скрипты Google не успели его затереть)
        DEFCONFIG="common/arch/arm64/configs/gki_defconfig"
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_KSU_NEXT=y" >> $DEFCONFIG
        echo "CONFIG_SUSFS=y" >> $DEFCONFIG
        echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
        echo "CONFIG_KPROFILES=y" >> $DEFCONFIG
        
        # Настройка окружения компилятора
        export PATH="$(pwd)/clang-bin/bin:$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-elf/bin:$(pwd)/prebuilts/gcc/linux-x86/arm/arm-eabi/bin:$PATH"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-elf-
        export CROSS_COMPILE_ARM32=arm-eabi-
        
        # Запуск сборки ядра hfdem с нашими изменениями
        BUILD_CONFIG=common/build.config.gki.arm64 build/build.sh

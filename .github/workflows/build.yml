name: Build Android GKI 5.15

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Free disk space
    run: |
      sudo rm -rf /usr/share/dotnet
      sudo rm -rf /opt/ghc
      sudo docker system prune -af || true

  - name: Install dependencies
    run: |
      sudo apt update

      sudo apt install -y \
        bc \
        bison \
        build-essential \
        ccache \
        curl \
        flex \
        git \
        libelf-dev \
        libssl-dev \
        lz4 \
        pahole \
        python3 \
        rsync \
        unzip \
        wget \
        zip

  - name: Clone Android build tools
    run: |
      git clone \
        --depth=1 \
        https://android.googlesource.com/kernel/build

  - name: Clone Proton Clang
    run: |
      git clone \
        --depth=1 \
        https://github.com/kdrag0n/proton-clang.git clang

  - name: Setup SukiSU Ultra
    run: |
      curl -LSs \
      https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
      | bash

  - name: Show kernel info
    run: |
      pwd
      ls -la
      find . -maxdepth 2 -type f | sort | head -200

  - name: Export toolchain
    run: |
      echo "$(pwd)/clang/bin" >> $GITHUB_PATH

  - name: Build kernel
    run: |
      export ARCH=arm64
      export SUBARCH=arm64

      if [ -f build/build.sh ]; then
        build/build.sh
      else
        echo "build/build.sh not found"
        exit 1
      fi

  - name: Collect artifacts
    run: |
      mkdir -p out_artifacts

      find . -type f \( \
        -name "Image" -o \
        -name "Image.gz" -o \
        -name "Image.lz4" -o \
        -name "*.ko" \
      \) -exec cp {} out_artifacts/ \; || true

  - name: Upload artifacts
    uses: actions/upload-artifact@v4
    with:
      name: kernel-build
      path: out_artifacts
```

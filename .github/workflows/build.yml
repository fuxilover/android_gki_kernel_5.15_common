name: Build GKI Kernel with KSU-Next + SUSFS + Undervolt

on:
  workflow_dispatch:
  push:
    branches: [ main, android13-5.15 ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KSU_NEXT_REPO: "https://github.com/KernelSU-Next/KernelSU-Next"
      SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
      KSU_BRANCH: "main"
      SUSFS_BRANCH: "gki-android13-5.15"

    steps:
      - name: Checkout your kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            libssl-dev libelf-dev xz-utils \
            curl git python3 ccache patch \
            cpio rsync

      # ---------- Подготовка структуры каталогов для Google build.sh ----------
      - name: Prepare workspace layout
        run: |
          set -x
          mkdir -p kernel-workspace/common
          shopt -s dotglob
          for item in *; do
            [ "$item" = "kernel-workspace" ] && continue
            mv "$item" kernel-workspace/common/
          done
          shopt -u dotglob
          cd kernel-workspace

      # ---------- Клонируем скрипты сборки Google ----------
      - name: Clone Google build scripts
        run: |
          cd kernel-workspace
          git clone https://android.googlesource.com/kernel/build \
            --branch master-kernel-build-2022 --depth=1 --single-branch

      # ---------- Клонируем тулчейны (GCC, Clang, NDK) ----------
      - name: Clone toolchains
        run: |
          cd kernel-workspace
          # GCC для aarch64
          git clone https://github.com/mvaisakh/gcc-arm64.git \
            prebuilts/gcc/linux-x86/aarch64/aarch64-elf \
            --depth=1 --single-branch --no-tags
          # GCC для arm32
          git clone https://github.com/mvaisakh/gcc-arm.git \
            prebuilts/gcc/linux-x86/arm/arm-eabi \
            --depth=1 --single-branch --no-tags
          # Proton Clang
          git clone https://github.com/kdrag0n/proton-clang.git \
            clang-bin --depth=1 --single-branch --no-tags
          # NDK (требуется для build.sh)
          git clone https://android.googlesource.com/platform/prebuilts/ndk \
            prebuilts/ndk --depth=1

      # ---------- Интеграция KernelSU-Next ----------
      - name: Setup KernelSU-Next
        run: |
          cd kernel-workspace/common
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next || true
          if [ ! -d "drivers/kernelsu" ] && [ ! -L "drivers/kernelsu" ]; then
            echo "ERROR: KernelSU-Next setup failed"
            exit 1
          fi
          echo "[OK] KernelSU-Next installed"

      # ---------- Интеграция SUSFS (с возможным игнорированием ошибок) ----------
      - name: Setup SUSFS
        run: |
          cd kernel-workspace
          rm -rf susfs4ksu
          git clone ${SUSFS_REPO} -b ${SUSFS_BRANCH} --depth=1
          cd common
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs*.h include/linux/
          SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches/ -maxdepth 1 -name "*5.15*.patch" | head -n 1)
          if [ -n "$SUSFS_PATCH" ]; then
            echo "Applying main SUSFS patch: $SUSFS_PATCH"
            patch -p1 < "$SUSFS_PATCH" || echo "WARNING: SUSFS patch had rejects"
          else
            echo "ERROR: main SUSFS patch not found"
            exit 1
          fi
          # Патч для KernelSU (может не наложиться – предупреждение)
          KSU_PATCH="../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            cd drivers/kernelsu
            echo "Applying KernelSU SUSFS patch (forcing)..."
            patch -p2 --force < "../../$KSU_PATCH" || true
            echo "Check for *.rej if build fails"
            cd ../..
          fi

      # ---------- KProfiles (дополнительно) ----------
      - name: Add KProfiles
        run: |
          cd kernel-workspace/common
          git clone https://github.com/beakthoven/Kprofiles.git drivers/misc/kprofiles --depth=1
          if ! grep -q "kprofiles" drivers/misc/Kconfig; then
            sed -i '/^endmenu/i source "drivers/misc/kprofiles/Kconfig"' drivers/misc/Kconfig
          fi
          if ! grep -q "kprofiles" drivers/misc/Makefile; then
            echo 'obj-$(CONFIG_KPROFILES) += kprofiles/' >> drivers/misc/Makefile
          fi

      # ---------- Настройка defconfig ----------
      - name: Enable KSU, SUSFS, KProfiles in defconfig
        run: |
          cd kernel-workspace/common
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_NEXT=y"
            echo "CONFIG_SUSFS=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KPROFILES=y"
          } >> "$DEFCONFIG"
          echo "[OK] defconfig updated"

      # ---------- Сборка ядра ----------
      - name: Build kernel
        run: |
          cd kernel-workspace
          export PATH="$(pwd)/clang-bin/bin:\
          $(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-elf/bin:\
          $(pwd)/prebuilts/gcc/linux-x86/arm/arm-eabi/bin:\
          $PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-elf-
          export CROSS_COMPILE_ARM32=arm-eabi-
          # Убедимся, что NDK найден
          export NDK_TRIPLE=aarch64-linux-android-
          BUILD_CONFIG=common/build.config.gki.aarch64 \
            build/build.sh

      # ---------- Сохранение артефактов ----------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            kernel-workspace/out/android13-5.15/dist/Image
            kernel-workspace/out/android13-5.15/dist/Image.gz
            kernel-workspace/out/android13-5.15/dist/modules/*
          if-no-files-found: warn

name: Build Kernel (arm64)

on:
  workflow_dispatch: # Кнопка ручного запуска в интерфейсе GitHub

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    
    steps:
    # ── 1. СКАЧИВАЕМ ИСХОДНИКИ ЯДРА ──────────────────────────────────────────
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: fuxilover/android_gki_kernel_5.15_common
        ref: android13-5.15-2025-05
        fetch-depth: 1

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"

    # ── 2. ОЧИСТКА ДИСКА ДЛЯ СБОРКИ ──────────────────────────────────────────
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    # ── 3. УСТАНОВКА НЕОБХОДИМЫХ ПАКЕТОВ ─────────────────────────────────────
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential flex \
          libssl-dev libelf-dev xz-utils \
          curl git python3 ccache patch \
          cpio rsync

    # ── 4. ПОДГОТОВКА СТРУКТУРЫ И KERNELSU-NEXT ──────────────────────────────
    - name: Setup Toolchains and KernelSU-Next
      run: |
        set -x
        
        # 1. Создаем чистый воркспейс для сборщика Google
        mkdir -p kernel-workspace/common
        
        # 2. Безопасно перемещаем исходники ядра в kernel-workspace/common
        find . -maxdepth 1 ! -name '.' ! -name 'kernel-workspace' -exec mv {} kernel-workspace/common/ \;

        cd kernel-workspace
        
        echo "=== Cloning Build Scripts and Toolchains ==="
        # Скрипты сборки от Google (клонируются рядом с папкой common)
        git clone https://android.googlesource.com/kernel/build --branch master-kernel-build-2022 --depth=1 --single-branch

        # Скачиваем компиляторы (в корень воркспейса)
        git clone https://github.com/mvaisakh/gcc-arm64.git prebuilts/gcc/linux-x86/aarch64/aarch64-elf --depth=1 --single-branch --no-tags
        git clone https://github.com/mvaisakh/gcc-arm.git prebuilts/gcc/linux-x86/arm/arm-eabi --depth=1 --single-branch --no-tags
        git clone https://github.com/kdrag0n/proton-clang.git clang-bin --depth=1 --single-branch --no-tags

        echo "=== Installing Official KernelSU-Next ==="
        cd common
        
        # Сбрасываем временный HOME, чтобы скрипт установки отработал корректно
        export HOME=/home/runner
        
        # Интеграция KernelSU-Next с использованием официального скрипта из документации
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

        # Проверка, что интеграция прошла успешно
        if [ ! -d "drivers/kernelsu" ]; then
          echo "ERROR: KernelSU-Next installation failed!"
          exit 1
        fi

        cd ..
        echo "=== Workspace Ready ==="

   # ── 5. ЗАПУСК КОМПИЛЯЦИИ ЯДРА ───────────────────────────────────────────
    - name: Run Kernel Build
      run: |
        cd kernel-workspace
        
        # 1. Экспортируем абсолютные пути к скачанным тулчейнам
        export CLANG_ROOT="$(pwd)/clang-bin"
        export PATH="$CLANG_ROOT/bin:$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-elf/bin:$(pwd)/prebuilts/gcc/linux-x86/arm/arm-eabi/bin:$PATH"
        
        # 2. Переменные окружения для сборщика Google
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        
        # 3. Указываем параметры кросс-компиляции для Proton Clang
        export CROSS_COMPILE=aarch64-elf-
        export CROSS_COMPILE_ARM32=arm-eabi-
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export READELF=llvm-readelf
        export STRIP=llvm-strip
        
        # 4. СБРОС ПЕРЕМЕННЫХ NDK (Решает ошибку "unable to find prebuilts/ndk")
        unset NDK_TRIPLE
        export USES_NDK=0
        
        # Даем права на исполнение главному билд-скрипту Google
        chmod +x build/build.sh
        
        # 5. Запуск сборки с явным указанием конфигурационного файла GKI ядра
        BUILD_CONFIG=common/build.config.gki.aarch64 ./build/build.sh
